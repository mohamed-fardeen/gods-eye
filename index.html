<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>God's Eye - Chennai Digital Twin</title>
    <meta
      name="description"
      content="Interactive 3D Digital Twin foundation of Chennai, Tamil Nadu powered by CesiumJS and OpenStreetMap 3D Buildings."
    />
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY=" crossorigin=""/>
    <link rel="stylesheet" href="/src/style.css" />
  </head>
  <body>
    <!-- Main Application Shell -->
    <div id="app-root" style="display: flex; width: 100vw; height: 100vh; overflow: hidden;">
      
      <!-- Sidebar Navigation -->
      <aside id="sidebar"></aside>

      <!-- Main Application Area -->
      <main id="main-area" style="flex: 1; display: flex; flex-direction: column; overflow: hidden; position: relative;">
        
        <!-- Top Header -->
        <header id="topbar"></header>

        <!-- Dynamic Page Content Container -->
        <div id="page-content" style="flex: 1; display: flex; flex-direction: column; overflow: hidden; z-index: 2;"></div>
  
        <!-- Full-screen 3D Cesium Container (Persistent) -->
        <div id="cesiumContainer" style="position: absolute; top: 0; left: 0; right: 0; bottom: 0; z-index: 1;"></div>
      </main>

    </div>

    <!-- Leaflet JS -->
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js" integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo=" crossorigin=""></script>
    
    <!-- Application Entry Point -->
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
