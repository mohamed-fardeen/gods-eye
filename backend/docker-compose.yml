version: '3.8'

services:
  db:
    image: postgis/postgis:15-3.3
    container_name: chennai_twin_db
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgrespassword
      POSTGRES_DB: chennai_twin
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  ai-worker:
    build: ../ai-worker
    container_name: chennai_twin_ai_worker
    ports:
      - "8001:8001"
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]
    # If a user doesn't have a GPU, docker compose might fail due to the nvidia driver requirement.
    # To run without GPU on local CPU machines, you would comment out the deploy block above.
    
volumes:
  postgres_data:
